services:
  postgres:
    image: postgres:16
    container_name: highload-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-highload_invest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: highload-clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: highload-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-banking:
    build:
      context: ./core-banking
    container_name: highload-core-banking
    restart: unless-stopped
    init: true
    ports:
      - "${CORE_BANKING_PORT:-8081}:8081"
    environment:
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-highload_invest}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ./api-gateway
    container_name: highload-api-gateway
    restart: unless-stopped
    init: true
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      PORT: 8080
      CLICKHOUSE_HTTP: http://clickhouse:8123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BANKING_URL: http://core-banking:8081
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-banking:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  go-ingestion:
    build:
      context: ./go-ingestion
    container_name: highload-go-ingestion
    restart: unless-stopped
    init: true
    environment:
      CLICKHOUSE_HTTP: http://clickhouse:8123
      REDIS_ADDR: redis:6379
      QUOTES_DEVICE: /dev/quotes
      BATCH_SIZE: ${INGESTION_BATCH_SIZE:-100}
      INTERVAL_MS: ${INGESTION_INTERVAL_MS:-500}
    devices:
      - "${QUOTES_DEVICE:-/dev/null}:/dev/quotes"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  quote-generator:
    build:
      context: ./quote-generator
    container_name: highload-quote-generator
    profiles: ["legacy-generator"]
    restart: unless-stopped
    init: true
    environment:
      CLICKHOUSE_HTTP: http://clickhouse:8123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERVAL_MS: ${INGESTION_INTERVAL_MS:-500}
      BATCH_SIZE: ${INGESTION_BATCH_SIZE:-100}
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  load-tester:
    build:
      context: ./load-tester
    container_name: highload-load-tester
    profiles: ["load"]
    init: true
    environment:
      GATEWAY_URL: http://api-gateway:8080
      BANKING_URL: http://core-banking:8081
      BOT_COUNT: ${BOT_COUNT:-100}
      DURATION_SEC: ${DURATION_SEC:-60}
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:
