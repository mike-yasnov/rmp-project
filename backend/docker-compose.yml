services:
  postgres:
    image: postgres:16
    container_name: highload-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-highload_invest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: highload-clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: highload-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-banking:
    build:
      context: ./core-banking
    container_name: highload-core-banking
    restart: unless-stopped
    init: true
    ports:
      - "${CORE_BANKING_PORT:-8081}:8081"
    environment:
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-highload_invest}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-20}
      GATEWAY_URL: http://api-gateway:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Kotlin OTEL SDK uses gRPC exporter (port 4317).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: core-banking
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=highload-invest,deployment.environment=${OTEL_ENV:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ./api-gateway
    container_name: highload-api-gateway
    restart: unless-stopped
    init: true
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      PORT: 8080
      CLICKHOUSE_HTTP: http://clickhouse:8123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BANKING_URL: http://core-banking:8081
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: api-gateway
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=highload-invest,deployment.environment=${OTEL_ENV:-local}
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-banking:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  go-ingestion:
    build:
      context: ./go-ingestion
    container_name: highload-go-ingestion
    restart: unless-stopped
    init: true
    environment:
      CLICKHOUSE_HTTP: http://clickhouse:8123
      REDIS_ADDR: redis:6379
      QUOTES_DEVICE: /dev/quotes
      QUOTES_REQUIRE_DEVICE: ${QUOTES_REQUIRE_DEVICE:-false}
      QUOTES_DEVICE_WAIT_SEC: ${QUOTES_DEVICE_WAIT_SEC:-0}
      BATCH_SIZE: ${INGESTION_BATCH_SIZE:-100}
      INTERVAL_MS: ${INGESTION_INTERVAL_MS:-500}
      # Go OTEL exporter (otlptracehttp) — uses OTLP HTTP on port 4318.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: go-ingestion
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=highload-invest,deployment.environment=${OTEL_ENV:-local}
    devices:
      - "${QUOTES_DEVICE:-/dev/null}:/dev/quotes"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  quote-generator:
    build:
      context: ./quote-generator
    container_name: highload-quote-generator
    profiles: ["legacy-generator"]
    restart: unless-stopped
    init: true
    environment:
      CLICKHOUSE_HTTP: http://clickhouse:8123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERVAL_MS: ${INGESTION_INTERVAL_MS:-500}
      BATCH_SIZE: ${INGESTION_BATCH_SIZE:-100}
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  load-tester:
    build:
      context: ./load-tester
    container_name: highload-load-tester
    profiles: ["load"]
    init: true
    environment:
      GATEWAY_URL: http://api-gateway:8080
      BANKING_URL: http://core-banking:8081
      BOT_COUNT: ${BOT_COUNT:-100}
      DURATION_SEC: ${DURATION_SEC:-60}
      CREATE_PARALLELISM: ${CREATE_PARALLELISM:-100}
      ACTIVE_REQUESTS: ${ACTIVE_REQUESTS:-50}
      WS_PERCENT: ${WS_PERCENT:-10}
      REQUEST_DELAY_MIN_MS: ${REQUEST_DELAY_MIN_MS:-50}
      REQUEST_DELAY_MAX_MS: ${REQUEST_DELAY_MAX_MS:-500}
    depends_on:
      api-gateway:
        condition: service_healthy

  # === Observability stack (FR-OBS-01/02) ===

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: highload-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP
      - "8889:8889"                     # Prometheus exporter
    volumes:
      - ./otel/otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: highload-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: highload-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.3.1
    container_name: highload-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./otel/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./otel/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:
  prometheus-data:
  grafana-data:
