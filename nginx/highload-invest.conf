upstream api_gateway {
    server 127.0.0.1:8080;
}

upstream core_banking {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    server_name _;

    # --- API Gateway ---
    # Quotes (REST)
    location /api/quotes {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Gateway health
    location = /gateway/health {
        proxy_pass http://api_gateway/health;
    }

    # --- Core Banking ---
    location /api/users {
        proxy_pass http://core_banking;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/trades {
        proxy_pass http://core_banking;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/portfolio {
        proxy_pass http://core_banking;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Banking health
    location = /banking/health {
        proxy_pass http://core_banking/health;
    }

    # --- Observability ---
    location /jaeger/ {
        proxy_pass http://127.0.0.1:16686/;
        proxy_set_header Host $host;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
    }

    # --- Root ---
    location = / {
        default_type application/json;
        return 200 '{"service":"highload-invest","endpoints":["/api/quotes","/api/users","/api/trades","/api/portfolio","/ws/quotes","/jaeger/","/grafana/"]}';
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","nginx":"up"}';
    }
}
